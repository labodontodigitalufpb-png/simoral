plugins {
    id "com.android.application"
}

android {
    namespace "br.ufpb.labodigit.examosim"
    compileSdk 35

    defaultConfig {
        applicationId "br.ufpb.labodigit.examosim"
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName "1.4-test"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir("generated/webAssets"))
    }
}

tasks.register("syncWebAssets", Sync) {
    from(rootProject.projectDir.parentFile) {
        include "index.html"
        include "app.js"
        include "styles.css"
        include "assets/**"
        include "data/cases.json"
        include "data/lesion-images.json"
    }
    into(layout.buildDirectory.dir("generated/webAssets"))
}

tasks.named("preBuild").configure {
    dependsOn("syncWebAssets")
}
